        function functionAsParameterTo(callback){
            console.log("Executing started");
            console.log("Welcome to callback function");
            
          setTimeout(callback,3000);
          console.log("Executing completed");
        }
        

        function wish(){
            console.log("have fun");
        }


    </script>
    


</head>

    <button onclick="functionAsParameter(wish)">callback_function</button>
